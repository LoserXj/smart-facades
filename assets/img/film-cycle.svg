<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#333"/></marker>
  </defs>
  <rect width="1200" height="420" fill="#ffffff"/>

  <!-- Night -->
  <text x="280" y="60" font-size="26" font-weight="600" fill="#222" text-anchor="middle">Night: absorb moisture</text>
  <rect x="130" y="150" width="300" height="34" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="280" y="135" font-size="20" fill="#666" text-anchor="middle">Film</text>
  <g stroke="#333" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M200 300 L200 196"/><path d="M280 300 L280 196"/><path d="M360 300 L360 196"/>
  </g>
  <text x="280" y="340" font-size="20" fill="#666" text-anchor="middle">Water vapour from indoor air</text>

  <!-- cycle -->
  <g stroke="#999" stroke-width="2" fill="none">
    <path d="M500 150 L690 150" marker-end="url(#a)"/>
    <path d="M690 240 L500 240" marker-end="url(#a)"/>
  </g>
  <text x="595" y="135" font-size="18" fill="#888" text-anchor="middle">sunrise</text>
  <text x="595" y="270" font-size="18" fill="#888" text-anchor="middle">sunset</text>

  <!-- Day -->
  <text x="920" y="60" font-size="26" font-weight="600" fill="#222" text-anchor="middle">Day: release moisture</text>
  <rect x="770" y="150" width="300" height="34" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="920" y="135" font-size="20" fill="#666" text-anchor="middle">Film warmed by sunlight</text>
  <g stroke="#333" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M840 196 L840 300"/><path d="M920 196 L920 300"/><path d="M1000 196 L1000 300"/>
  </g>
  <text x="920" y="340" font-size="20" fill="#666" text-anchor="middle">Stored water released</text>
</svg>
